<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115年農村社區綠色照顧推動計畫 - 自評表批次產生器</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5a8b3a">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background:
      radial-gradient(ellipse at top left, #e8f3e0 0%, transparent 45%),
      radial-gradient(ellipse at bottom right, #fdf4d9 0%, transparent 45%),
      #f7f5ec;
    color: #2d3a2e;
    min-height: 100vh;
    padding: 40px 16px;
    font-size: 17px;
    line-height: 1.6;
  }
  .container {
    max-width: 780px; margin: 0 auto;
    background: #fefdf7;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(90, 110, 70, 0.08), 0 1px 3px rgba(0,0,0,0.04);
    overflow: hidden;
  }
  .hero {
    background: linear-gradient(135deg, #5a8b3a 0%, #7ba960 100%);
    color: white;
    padding: 32px 32px 28px;
    position: relative;
  }
  .hero-icon {
    font-size: 40px; line-height: 1;
    margin-bottom: 10px;
    display: block;
  }
  h1 {
    font-size: 26px; font-weight: 700;
    margin: 0 0 8px; letter-spacing: 0.5px;
  }
  .sub {
    font-size: 16px; opacity: 0.95;
    margin: 0;
  }
  .content { padding: 32px; }

  .drop {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 3px dashed #9cb87a;
    border-radius: 14px;
    padding: 48px 24px;
    background: linear-gradient(180deg, #f5faed 0%, #eff6e0 100%);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .drop:hover { background: linear-gradient(180deg, #ecf5dc 0%, #e3f0c6 100%); border-color: #7ba960; }
  .drop.hover { border-color: #5a8b3a; background: #dff0c6; transform: scale(1.01); }
  .drop input { display: none; }
  .drop-icon { font-size: 48px; line-height: 1; }
  .drop-title { font-size: 19px; font-weight: 500; color: #3d5c2e; }
  .drop-hint { font-size: 15px; color: #6b7d5a; }

  .status {
    margin-top: 20px; padding: 16px 20px;
    border-radius: 10px;
    display: none;
    font-size: 16px;
    line-height: 1.5;
  }
  .status.info { display: block; background: #eef4fa; color: #2a4d75; border-left: 5px solid #5b8db5; }
  .status.ok   { display: block; background: #e9f5df; color: #2d5a1f; border-left: 5px solid #5a8b3a; }
  .status.err  { display: block; background: #fbeae4; color: #7a2c1a; border-left: 5px solid #c25336; }

  .preview {
    margin-top: 20px;
    background: #fbf9ee;
    border: 1px solid #e5dfb8;
    padding: 18px 22px;
    border-radius: 10px;
    display: none;
  }
  .preview-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px; margin-bottom: 8px;
    border-bottom: 1px dashed #d8cf95;
  }
  .preview-title { color: #3d5c2e; font-size: 16px; font-weight: 700; }
  .preview-all { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #4a5a3e; cursor: pointer; user-select: none; }
  .preview-list { list-style: none; margin: 0; padding: 0; }
  .preview-list li {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px dotted #ece5b8;
    cursor: pointer;
  }
  .preview-list li:last-child { border-bottom: none; }
  .preview-list li:hover { background: #f5f0d8; }
  .preview-list li input[type=checkbox] { flex-shrink: 0; }
  .preview-list .name { color: #2d3a2e; font-size: 16px; flex: 1; }
  .preview-list .type { color: #8a9878; font-size: 14px; }
  input[type=checkbox] {
    width: 18px; height: 18px;
    accent-color: #5a8b3a;
    cursor: pointer;
  }

  .actions { margin-top: 28px; text-align: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 32px;
    background: linear-gradient(180deg, #6ba24f 0%, #5a8b3a 100%);
    color: white;
    border: none; border-radius: 30px;
    cursor: pointer;
    font-size: 17px; font-weight: 500;
    font-family: inherit;
    box-shadow: 0 3px 10px rgba(90, 139, 58, 0.25);
    transition: all 0.15s;
  }
  .btn:hover:not(:disabled) { background: linear-gradient(180deg, #7ab35b 0%, #669c40 100%); transform: translateY(-1px); box-shadow: 0 5px 14px rgba(90, 139, 58, 0.35); }
  .btn:disabled { background: #b8b8b8; cursor: not-allowed; box-shadow: none; }
  .btn-icon { font-size: 20px; line-height: 1; }

  .footer {
    padding: 20px 32px 28px;
    color: #8a9878; font-size: 13px;
    text-align: center;
    border-top: 1px solid #eee5c5;
    background: #fbf9ee;
  }
  .footer span { color: #b0a878; margin: 0 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <span class="hero-icon">🌾</span>
    <h1>115年農村社區綠色照顧推動計畫</h1>
    <p class="sub">社區自評表 · Excel → Word 批次產生工具</p>
  </div>

  <div class="content">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xls">
      <div class="drop-icon">📋</div>
      <div class="drop-title">點此選擇 Excel 檔，或拖曳到這裡</div>
      <div class="drop-hint">115年農村社區綠色照顧推動計畫－社區自評表單</div>
    </label>

    <div id="status" class="status"></div>
    <div id="preview" class="preview"></div>

    <div class="actions">
      <button class="btn" id="genBtn" disabled>
        <span class="btn-icon">🌱</span>
        <span>產生 Word 檔並打包下載</span>
      </button>
    </div>
  </div>

  <div class="footer">
    單檔 HTML <span>·</span> 純瀏覽器端執行 <span>·</span> 檔案不會上傳到任何伺服器
  </div>
</div>

// ========== 全域狀態 ==========
let excelRows = null; // Excel 讀進來的每列資料 (物件陣列)

// ========== UI 元素 ==========
const dropEl = document.getElementById('drop');
const fileEl = document.getElementById('file');
const statusEl = document.getElementById('status');
const previewEl = document.getElementById('preview');
const genBtn = document.getElementById('genBtn');

function setStatus(msg, type='info') {
  statusEl.className = 'status ' + type;
  statusEl.textContent = msg;
}

// ========== 上傳處理 ==========
['dragenter','dragover'].forEach(ev => dropEl.addEventListener(ev, e => {
  e.preventDefault(); dropEl.classList.add('hover');
}));
['dragleave','drop'].forEach(ev => dropEl.addEventListener(ev, e => {
  e.preventDefault(); dropEl.classList.remove('hover');
}));
dropEl.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
fileEl.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) handleFile(f);
});

async function handleFile(file) {
  setStatus(`讀取中：${file.name}`);
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    // defval:'' 讓空白格變空字串
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if (rows.length === 0) throw new Error('Excel 內沒有資料列');
    excelRows = rows;

    // 預覽 (含勾選)
    previewEl.style.display = 'block';
    let html = `
      <div class="preview-header">
        <div class="preview-title">📌 共 ${rows.length} 筆社區資料</div>
        <label class="preview-all">
          <input type="checkbox" id="chkAll" checked>
          <span>全選</span>
        </label>
      </div>
      <ul class="preview-list" id="rowList">`;
    rows.forEach((r, i) => {
      const name = r['社區名稱'] || `(第${i+1}列 未命名)`;
      const type = r['今年度為延續案或新提案？'] || '';
      html += `
        <li>
          <input type="checkbox" class="rowChk" data-idx="${i}" checked>
          <span class="name">${escapeHtml(name)}</span>
          <span class="type">${escapeHtml(type)}</span>
        </li>`;
    });
    html += '</ul>';
    previewEl.innerHTML = html;

    // 綁定：點整列 = toggle 該 checkbox；全選連動；即時更新按鈕文字
    const chkAll = document.getElementById('chkAll');
    const rowChks = document.querySelectorAll('.rowChk');
    document.querySelectorAll('#rowList li').forEach(li => {
      li.addEventListener('click', e => {
        if (e.target.tagName !== 'INPUT') {
          const chk = li.querySelector('input[type=checkbox]');
          chk.checked = !chk.checked;
          chk.dispatchEvent(new Event('change'));
        }
      });
    });
    chkAll.addEventListener('change', () => {
      rowChks.forEach(c => c.checked = chkAll.checked);
      updateBtn();
    });
    rowChks.forEach(c => c.addEventListener('change', () => {
      const arr = [...rowChks];
      chkAll.checked = arr.every(c => c.checked);
      updateBtn();
    }));
    updateBtn();

    setStatus(`✓ 讀取成功，共 ${rows.length} 筆。請勾選要產生的社區。`, 'ok');
  } catch (err) {
    setStatus(`讀取失敗：${err.message}`, 'err');
    console.error(err);
  }
}

// 依勾選狀態更新按鈕文字/啟用
function updateBtn() {
  const checked = document.querySelectorAll('.rowChk:checked').length;
  const btnText = genBtn.querySelector('span:last-child');
  if (checked === 0) {
    genBtn.disabled = true;
    btnText.textContent = '請先勾選要產生的社區';
  } else {
    genBtn.disabled = false;
    btnText.textContent = `產生 ${checked} 份 Word 檔並打包下載`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ========== 產生 Word ==========
genBtn.addEventListener('click', async () => {
  if (!excelRows) return;
  // 取得勾選的 row indices
  const selectedIdxs = [...document.querySelectorAll('.rowChk:checked')].map(c => parseInt(c.dataset.idx));
  if (selectedIdxs.length === 0) return;
  const selectedRows = selectedIdxs.map(i => excelRows[i]);
  genBtn.disabled = true;
  setStatus(`產生中... (0/${selectedRows.length})`);

  try {
    // 解碼範本 base64 為 Uint8Array
    const bin = atob(TEMPLATE_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const outZip = new JSZip();

    for (let i = 0; i < selectedRows.length; i++) {
      const row = selectedRows[i];
      const originalIdx = selectedIdxs[i];
      const communityName = (row['社區名稱'] || `社區${originalIdx+1}`).toString().trim();
      setStatus(`產生中... (${i+1}/${selectedRows.length}) - ${communityName}`);
      await new Promise(r => setTimeout(r, 0));

      const zipTemplate = await JSZip.loadAsync(bytes);
      const docXml = await zipTemplate.file('word/document.xml').async('string');
      const mapping = buildMapping(row);
      const filledXml = applyMapping(docXml, mapping);
      zipTemplate.file('word/document.xml', filledXml);
      const docxBlob = await zipTemplate.generateAsync({type:'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});

      const safeName = communityName.replace(/[\/\\:*?"<>|]/g, '_');
      outZip.file(`${String(originalIdx+1).padStart(2,'0')}_${safeName}.docx`, docxBlob);
    }

    setStatus(`打包中...`);
    const outBlob = await outZip.generateAsync({type:'blob'});
    const today = new Date().toISOString().slice(0,10);
    saveAs(outBlob, `115年社區自評表_${today}.zip`);
    setStatus(`✓ 完成！已下載 ${selectedRows.length} 份自評表。`, 'ok');
  } catch (err) {
    setStatus(`產生失敗：${err.message}`, 'err');
    console.error(err);
  } finally {
    updateBtn();
  }
});

// ========== 建 placeholder 對應表 ==========
// 對每一列 Excel 資料，產生 { 'PLACEHOLDER_KEY': '要填入的值' }
function buildMapping(row) {
  const m = {};
  // 建立正規化欄名對應 (去掉所有空白 & 換行) → 原欄名
  const _normKeys = {};
  for (const k of Object.keys(row)) {
    _normKeys[k.replace(/[\s\u3000]+/g, '')] = k;
  }
  // 取值：支援直接對到，或模糊比對 (去空白後開頭匹配)
  const get = (col) => {
    if (row[col] != null && row[col] !== '') return String(row[col]).trim();
    const normCol = col.replace(/[\s\u3000]+/g, '');
    if (_normKeys[normCol] != null) return String(row[_normKeys[normCol]] || '').trim();
    // 前綴模糊比對
    for (const [nk, ok] of Object.entries(_normKeys)) {
      if (nk.startsWith(normCol) || normCol.startsWith(nk.slice(0, Math.min(20, nk.length)))) {
        return String(row[ok] || '').trim();
      }
    }
    return '';
  };
  const CHK = '☑', UNCHK = '□';
  const chk = (b) => b ? CHK : UNCHK;

  // ---------- 標頭 ----------
  m.COMMUNITY_NAME = get('社區名稱');

  // 延續/新提案
  const appType = get('今年度為延續案或新提案？');
  m.CHK_延續 = chk(appType.includes('延續'));
  m.CHK_新提案 = chk(appType.includes('新提'));

  // 各年度主軸 (逗號分隔字串)
  ['111','112','113','114','115'].forEach(y => {
    const axes = get(`請勾選各年度執行主軸  [${y}年主軸]`); // 注意兩個空白
    m[`CHK_Y${y}_場域`] = chk(axes.includes('綠場域'));
    m[`CHK_Y${y}_飲食`] = chk(axes.includes('綠飲食'));
    m[`CHK_Y${y}_療育`] = chk(axes.includes('綠療育'));
    m[`CHK_Y${y}_陪伴`] = chk(axes.includes('綠陪伴'));
    // 補助金額
    m[`AMT_Y${y}`] = get(`${y}年補助金額（萬元）`);
  });

  // ---------- 其他部會資源 ----------
  const other = get('其他部會資源說明');
  m.CHK_關懷據點 = chk(other.includes('關懷據點'));
  m.CHK_C級 = chk(other.includes('C級') || other.includes('巷弄'));
  m.CHK_文化健康站 = chk(other.includes('文化健康站'));
  m.CHK_伯公照護站 = chk(other.includes('伯公'));
  m.CHK_樂齡 = chk(other.includes('樂齡'));
  // 次數/金額欄位 Excel 沒明細，留空
  ['關懷據點','C級','文化健康站','伯公照護站'].forEach(k => {
    m[`OTHER_${k}_次`] = '';
    m[`OTHER_${k}_萬`] = '';
  });

  // ---------- 綠場域 ----------
  const venueField = get('綠場域辦理情形');
  const communityGarden = get('承上題，綠場域- 共餐菜園數量及距離據點情形 ( 無則免填  )');
  const therapyGarden = get('承上題，綠場域- 療育花園數量、面積及距離據點情形 ( 無則免填  )');
  m.CHK_共餐菜園 = chk(venueField.includes('共餐菜園'));
  m.CHK_療育花園 = chk(venueField.includes('療育花園'));
  m.CHK_綠場域_其他 = chk(venueField.includes('其他'));

  // 拆「共1處，面積為5.33平方公尺，距據點約100公尺」等格式
  function parseVenue(str) {
    if (!str) return { 處: '', 面積: '', 距: '' };
    const 處 = (str.match(/(\d+)\s*處/) || [])[1] || '';
    // 面積：先找「面積為/約 X 平方公尺」，再找出現「平方公尺」前的數字
    let 面積 = (str.match(/面積[為約]?\s*([\d.]+)/) || [])[1]
            || (str.match(/([\d.]+)\s*平方公尺/) || [])[1] || '';
    // 括號補充 (例如 "(約20坪)") 併入面積
    const paren = (str.match(/\(([^)]+)\)/) || [])[1];
    if (paren && 面積) 面積 = 面積 + '(' + paren + ')';
    const 距 = (str.match(/距[^\d]*([\d.]+)/) || [])[1] || '';
    // 若什麼結構都沒解出來，把整段塞入面積欄（保住原始資訊）
    if (!處 && !面積 && !距) 面積 = str;
    return { 處, 面積, 距 };
  }
  const cg = parseVenue(communityGarden);
  const tg = parseVenue(therapyGarden);
  m.VENUE_共餐菜園_處 = cg.處;
  m.VENUE_共餐菜園_面積 = cg.面積;
  m.VENUE_共餐菜園_距 = cg.距;
  m.VENUE_療育花園_處 = tg.處;
  m.VENUE_療育花園_面積 = tg.面積;
  m.VENUE_療育花園_距 = tg.距;
  m.VENUE_其他 = '';

  // 未申請本主軸 → 把整格提示「未申請」，只留一處
  const isVenueApplied = get('請勾選各年度執行主軸  [115年主軸]').includes('綠場域');
  if (!isVenueApplied) {
    m.VENUE_共餐菜園_處 = '未申請';
    m.VENUE_共餐菜園_面積 = '';
    m.VENUE_共餐菜園_距 = '';
    m.VENUE_療育花園_處 = '';
    m.VENUE_療育花園_面積 = '';
    m.VENUE_療育花園_距 = '';
  }

  // ---------- 綠飲食 ----------
  const isFoodApplied = get('請勾選各年度執行主軸  [115年主軸]').includes('綠飲食');
  const days = get('綠飲食- 每週供餐(含共餐及送餐)天數/供餐週數');
  // 解析 "3天 / 30週" 或 "3天/30週"
  let d1 = '', d2 = '';
  if (days) {
    const parts = days.split('/');
    d1 = (parts[0] || '').replace(/[天週\s]/g,'');
    d2 = (parts[1] || '').replace(/[天週\s]/g,'');
  }
  m.FOOD_天數 = d1;
  m.FOOD_週數 = d2;

  // 人數：格式多元「共餐33人」「送餐20人/取餐20人」「送餐27人/定點取餐5人/配合節慶活動共餐約25人」
  const people = get('綠飲食-送餐人數/定點取餐人數/共餐人數');
  m.FOOD_送餐人數 = extractNum(people, /送餐[^\d]*(\d+)/);
  m.FOOD_取餐人數 = extractNum(people, /(?:定點)?取餐[^\d]*(\d+)/);
  m.FOOD_共餐人數 = extractNum(people, /共餐[^\d]*(\d+)/);
  // 若三格都沒解出來但整串有內容 → 塞第一格
  if (!m.FOOD_送餐人數 && !m.FOOD_取餐人數 && !m.FOOD_共餐人數 && people) {
    m.FOOD_送餐人數 = people;
  }

  // 服務鄰近
  const nearby = get('綠飲食-是否服務鄰近社區');
  const nearbyInfo = get('綠飲食- 鄰近社區服務情形');
  m.CHK_服務鄰近_有 = chk(nearby.startsWith('是'));
  m.CHK_服務鄰近_無 = chk(nearby.startsWith('否'));
  m.FOOD_鄰近_處 = '';
  m.FOOD_鄰近_名稱 = nearbyInfo;
  m.FOOD_鄰近_人 = '';

  // 供餐星期：只認「星期X」/「週X」/「禮拜X」的精確組合，避免「一」「三」被誤觸發
  const weekdays = get('綠飲食- 供餐星期與餐食情形');
  const hasWeekday = (ch) => new RegExp(`(?:星期|週|禮拜)${ch}`).test(weekdays);
  m.CHK_供餐_一 = chk(hasWeekday('一'));
  m.CHK_供餐_二 = chk(hasWeekday('二'));
  m.CHK_供餐_三 = chk(hasWeekday('三'));
  m.CHK_供餐_四 = chk(hasWeekday('四'));
  m.CHK_供餐_五 = chk(hasWeekday('五'));

  if (!isFoodApplied) {
    // 綠飲食未申請
    m.FOOD_天數 = '未申請';
    m.FOOD_週數 = '';
    m.FOOD_送餐人數 = '';
    m.FOOD_取餐人數 = '';
    m.FOOD_共餐人數 = '';
    m.FOOD_鄰近_名稱 = '';
    m.CHK_供餐_一 = UNCHK;
    m.CHK_供餐_二 = UNCHK;
    m.CHK_供餐_三 = UNCHK;
    m.CHK_供餐_四 = UNCHK;
    m.CHK_供餐_五 = UNCHK;
    m.CHK_服務鄰近_有 = UNCHK;
    m.CHK_服務鄰近_無 = UNCHK;
  }

  // ---------- 綠療育 ----------
  const isTherapyApplied = get('請勾選各年度執行主軸  [115年主軸]').includes('綠療育');
  const therapyPeople = get('綠療育- 參與人數/男性人數/女性人數');
  // 解析 "共25人，男性8人，女性17人" 或 "31人/男性2人/女性29人" 或 "共32人，男性14人，女性18人"
  m.THERAPY_人數 = extractNum(therapyPeople, /(?:共|參與)?(\d+)人/) || extractNumFirst(therapyPeople);
  m.THERAPY_男 = extractNum(therapyPeople, /男性?(\d+)/);
  m.THERAPY_女 = extractNum(therapyPeople, /女性?(\d+)/);

  const courses = get('綠療育-課程總堂數(年)/含農業療育特色課程堂數/食農教育課程堂數');
  m.THERAPY_總堂 = extractNum(courses, /總堂數\s*(\d+)/) || extractNumFirst(courses);
  m.THERAPY_農療 = extractNum(courses, /農業療育[^\d]*(\d+)/);
  m.THERAPY_食農 = extractNum(courses, /食農教育[^\d]*(\d+)/);

  m.THERAPY_時段 = get('綠療育- 課程安排時段');

  if (!isTherapyApplied) {
    m.THERAPY_人數 = '未申請';
    m.THERAPY_男 = '';
    m.THERAPY_女 = '';
    m.THERAPY_總堂 = '';
    m.THERAPY_農療 = '';
    m.THERAPY_食農 = '';
    m.THERAPY_時段 = '';
  }

  // ---------- 綠陪伴 ----------
  const isCompApplied = get('請勾選各年度執行主軸  [115年主軸]').includes('綠陪伴');
  const hasGreenCarer = get('綠陪伴-是否聘用農村綠照員');
  m.CHK_綠照員_有 = chk(hasGreenCarer.startsWith('是'));
  m.CHK_綠照員_無 = chk(hasGreenCarer.startsWith('否'));
  m.COMP_綠照員名 = get('綠陪伴-綠照員姓名');

  const hasVol = get('綠陪伴-是否配置志工');
  m.CHK_志工_有 = chk(hasVol.startsWith('是'));
  m.CHK_志工_無 = chk(hasVol.startsWith('否'));
  m.COMP_志工人數 = get('綠陪伴-志工人數');

  // 到府關懷/電話問安：格式多元「11」「25/100」「129人次」「4次」
  function parseVisit(str) {
    const nums = (str || '').match(/\d+/g) || [];
    if (nums.length >= 2) return { 位: nums[0], 人次: nums[1] };
    if (nums.length === 1) {
      // 只有一個數字：看整串是否含「人次」或「次」→ 判定為人次；否則為位
      if (/人次|次/.test(str)) return { 位: '', 人次: nums[0] };
      return { 位: nums[0], 人次: '' };
    }
    return { 位: '', 人次: '' };
  }
  const visit = parseVisit(get('綠陪伴-每月平均到府關懷人數/共計人次'));
  m.COMP_到府_位 = visit.位;
  m.COMP_到府_人次 = visit.人次;
  const call = parseVisit(get('綠陪伴-每月平均電話問安人數/共計人次'));
  m.COMP_電話_位 = call.位;
  m.COMP_電話_人次 = call.人次;

  const grade = get('綠陪伴-是否建立分級制度');
  m.CHK_分級_有 = chk(grade.startsWith('是'));
  m.CHK_分級_無 = chk(grade.startsWith('否'));
  m.COMP_訪視頻率 = get('綠陪伴-重點訪視頻率');

  if (!isCompApplied) {
    m.COMP_綠照員名 = '未申請';
    m.COMP_志工人數 = '';
    m.COMP_到府_位 = ''; m.COMP_到府_人次 = '';
    m.COMP_電話_位 = ''; m.COMP_電話_人次 = '';
    m.COMP_訪視頻率 = '';
  }

  // ---------- 設備購置 ----------
  const equip = get('設備購置-是否有設備購置');
  m.CHK_設備_有 = chk(equip.startsWith('有'));
  m.CHK_設備_無 = chk(equip.startsWith('無'));
  m.EQUIP_內容 = get('請問購置設備那些設備？');

  // ---------- 待協助問題 ----------
  const helpRaw = get('請列出目前實際執行時最需要協助之2至3項問題：');
  const helps = splitHelps(helpRaw);
  m.HELP_1 = helps[0] || '';
  m.HELP_2 = helps[1] || '';
  m.HELP_3 = helps[2] || '';

  // ========== 評估區 (是/否 + 說明) ==========
  // 使用一個統一的 helper 建立 Q_YES/Q_NO/Q_REASON
  const yesNoQuestions = [
    ['Q1_1', '1-1.綠場域之位置、距離及步行動線是否考量高齡者之可及性與安全性，並依實際需要設置座椅、遮蔭等休憩設施？ （包含距社區據點或日常公共空間原則約500公尺、步行動線及人車分道等情形。）', '承上題，請說明原因 (1-1)'],
    ['Q1_2', '1-2. 場域安全防護及高齡友善設施是否設置完善、功能正常，並定期辦理環境清潔維護？ （包含安全照明、緊急求助鈴、扶手、止滑、無障礙動線及清楚標示等。）', '承上題，請說明原因 (1-2)'],
    ['Q1_3', '1-3. 是否訂有緊急災害、醫療救助、逃生避難及防疫措施，並使社區人員（含志工）熟悉相關程序及急救用品位置？', '承上題，請說明原因 (1-3)'],
    ['Q2_2_1', '2-2-1.  菜單是否結合營養專業，並符合高齡者營養、牙口及健康需求？ （避免過多加工品、油炸及高油鹽糖餐點）', '2-2-2. 承上題，請說明原因 (2-2-1)'],
    ['Q2_3_6', '2-3-6.供餐動線是否考量高齡志工使用安全性？', '2-3-7. 承上題，請說明原因 (2-3-6)'],
    ['Q2_4_1', '2-4-1  供餐場域是否符合高齡友善、安全及衛生需求，並定期辦理環境清潔維護？ （包含飲水設施、使用空間、通道、止滑及廚房清潔等。）', '2-4-2. 承上題，請說明原因 (2-4-1)'],
    ['Q2_4_3', '2-4-3   廚房器具、餐具及食材是否依食品安全原則妥善分類、標示、收納及保存？ （包含使用食品安全器具、冷凍冷藏分層及分類收納等。）', '2-4-4. 承上題，請說明原因 (2-4-3)'],
    ['Q3_2_2', '3-2-2. 師資及課程材料是否優先運用社區在地人力與資源，且經費配置合理？ （包含長者為師、在地青年或青農、志工及就地取材等。）', '3-2-3. 承上題，請說明原因 (3-2-2)'],
    ['Q3_4_1', '3-4-1.   社區是否依本署格式記錄課程內容？', '3-4-2. 承上題，請說明原因 (3-4-1)'],
    ['Q4_1_2', '4-1-2 是否完整記錄服務內容、簽到、長者需求及身心變化？（綠陪伴手冊資料）', '4-1-3. 承上題，請說明原因 (4-1-2)'],
    ['Q4_2_2', '4-2-2. 是否建立高齡者風險通報、緊急聯絡及服務追蹤機制？', '4-2-3. 承上題，請說明原因 (4-2-2)'],
    ['Q4_2_4', '4-2-4. 是否建立綠陪伴志工網絡，並明確劃分綠照員與志工之角色及工作內容？', '4-2-5. 承上題，請說明原因 (4-2-4)'],
    ['Q4_3_1', '4-3-1.   參與計畫之高齡者是否普遍感到愉悅與滿足，並有助於其社會參與、自我充實及維持尊嚴？', '4-3-2. 承上題，請說明原因 (4-3-1)'],
    ['Q4_4_1', '4-4-1.   社區推動綠照計畫之內部支持及執行共識是否良好？ （包含居民與志工支持計畫，以及綠照員了解計畫內容並能配合推動。）', '4-4-2. 承上題，請說明原因 (4-4-1)'],
  ];
  yesNoQuestions.forEach(([qid, colAns, colReason]) => {
    const ans = get(colAns);
    m[`${qid}_YES`] = chk(ans.startsWith('是'));
    m[`${qid}_NO`] = chk(ans.startsWith('否'));
    m[`${qid}_REASON`] = get(colReason);

  // ---------- Q2-1 食材來源 / 供餐方式 ----------
  const foodSource = get('2-1-1  供餐食材來源');
  const hasGarden = foodSource.includes('共餐菜園');
  const hasLocal = foodSource.includes('在地農民') || foodSource.includes('合作社');
  // 「其他」的判定：把已知選項字串移除後，若還有剩就是其他
  let otherText = foodSource
    .replace(/共餐菜園/g, '')
    .replace(/在地農民或合作社/g, '')
    .replace(/在地農民/g, '')
    .replace(/[,、\s]+/g, ' ')
    .trim();
  m.CHK_食材_共餐菜園 = chk(hasGarden);
  m.CHK_食材_在地 = chk(hasLocal);
  m.CHK_食材_其他 = chk(otherText.length > 0);
  m.Q2_1_食材其他 = otherText;

  const foodWay = get('2-1-2. 供餐方式');
  const supplier = get('2-1-3.   供餐廠商或外部供餐單位名稱');
  m.CHK_供餐_自煮 = chk(foodWay.includes('自行烹煮') || foodWay.includes('自煮'));
  m.CHK_供餐_外購 = chk(foodWay.includes('外購') || foodWay.includes('便當'));
  m.CHK_供餐_合作 = chk(foodWay.includes('農會') || foodWay.includes('田媽媽') || foodWay.includes('團膳'));
  // supplier 只填到勾中的欄位，避免同一個名稱重複出現在兩處
  m.Q2_1_供餐廠商 = m.CHK_供餐_外購 === CHK ? supplier : '';
  m.Q2_1_合作名稱 = m.CHK_供餐_合作 === CHK ? supplier : '';

  // ---------- Q2-2-3 留樣 ----------
  const sample = get('2-2-3. 餐食是否分別留樣? (1道菜約200g，須分別密封以攝氏7度以下冷藏保存至少48小時)');
  m.Q2_2_3_YES = chk(sample.includes('是'));
  m.Q2_2_3_NO = chk(sample.startsWith('否'));
  m.Q2_2_3_REASON = get('2-2-4. 承上題，請說明原因 (2-2-3)');

  // ---------- Q2-3-1 廚工給薪 ----------
  const chefPay = get('2-3-1. 廚工或社區媽媽是否給薪制？');
  m.Q2_3_1_YES = chk(chefPay.startsWith('是'));
  m.Q2_3_1_NO = chk(chefPay.startsWith('否'));
  m.Q2_3_1_SOURCE = get('2-3-2. 承上題，請說明原因 (2-3-1)');
  m.Q2_3_1_REASON = '';

  // ---------- Q2-3-3 廚工/志工人數 ----------
  const staff = get('2-3-3.   廚工與社區志工人數');
  m.Q2_3_3_廚工 = extractNum(staff, /廚工\s*(\d+)/) || extractNumFirst(staff);
  m.Q2_3_3_志工 = extractNum(staff, /志工\s*(\d+)/);

  // ---------- Q2-3-4 服務量能 ----------
  const capacity = get('2-3-4.  廚工或社區志工服務量能');
  m.Q2_3_4_FULL = chk(capacity.includes('足夠'));
  m.Q2_3_4_INSUFF = chk(capacity.includes('不足'));
  m.Q2_3_4_REASON = get('2-3-5. 承上題，請說明原因 (2-3-4)');

  // ---------- Q3-1-1 結合特色 ----------
  const localFeature = get('3-1-1. 是否結合在地自然、人文或產業特色，融入活躍老化及世代協力概念？');
  m.Q3_1_1_YES = chk(localFeature.startsWith('是'));
  m.Q3_1_1_NO = chk(localFeature.startsWith('否'));
  m.Q3_1_1_DETAIL = get('3-1-2. 承上題， 如勾「是」，請說明結合社區何種概念；如勾 「否」， 請說明原因 (3-1-1)');
  m.Q3_1_1_REASON = '';

  // ---------- Q3-2-1 師資分配 ----------
  // 格式多元：「外聘60堂」「外聘堂數 8  堂、內聘堂數 47  堂」等
  const teach = get('3-2-1. 師資及課程配置');
  m.Q3_2_1_外聘 = extractNum(teach, /外聘[^\d]*(\d+)/);
  m.Q3_2_1_內聘 = extractNum(teach, /內聘[^\d]*(\d+)/);

  // ---------- Q3-3-1 綠照員參與 ----------
  const carerJoin = get('3-3-1.  綠照員是否參與課程規劃、教案設計或課程教學？');
  m.Q3_3_1_YES = chk(carerJoin.startsWith('是'));
  m.Q3_3_1_NO = chk(carerJoin.startsWith('否') && !carerJoin.includes('無綠照員'));
  m.Q3_3_1_NA = chk(carerJoin.includes('無綠照員'));
  m.Q3_3_1_REASON = get('3-3-2. 承上題，請說明原因 (3-3-1)');

  // ---------- Q4-1-1 綠照員費用編列 ----------
  const carerFee = get('4-1-1.   綠照員費用編列採月薪還是按日按件計資？');
  m.Q4_1_1_月薪 = chk(carerFee.includes('月薪') || carerFee.includes('薪俸'));
  m.Q4_1_1_日薪 = chk(carerFee.includes('日薪'));
  m.Q4_1_1_時薪 = chk(carerFee.includes('時薪'));
  m.Q4_1_1_其他 = chk(carerFee && !carerFee.includes('月薪') && !carerFee.includes('薪俸') && !carerFee.includes('日薪') && !carerFee.includes('時薪'));
  // 各種金額/時數用 regex 抓
  m.Q4_1_1_月薪額 = extractNum(carerFee, /(?:月薪|薪俸)[^\d]*(\d+)/);
  m.Q4_1_1_日薪額 = extractNum(carerFee, /日薪[^\d]*(\d+)/);
  m.Q4_1_1_日薪天 = '';
  m.Q4_1_1_時薪額 = extractNum(carerFee, /時薪[^\d]*(\d+)/);
  m.Q4_1_1_時數 = extractNum(carerFee, /(\d+)\s*小時/);
  m.Q4_1_1_週天 = extractNum(carerFee, /(\d+)\s*天/);
  m.Q4_1_1_其他說明 = m.Q4_1_1_其他 === CHK ? carerFee : '';

  // ---------- Q4-2-1 關懷頻率 ----------
  const careFreq = get('4-2-1.  社區高齡者關懷頻率？');
  m.Q4_2_1_週 = chk(careFreq.includes('每週'));
  m.Q4_2_1_月 = chk(careFreq.includes('每月'));
  m.Q4_2_1_偶而 = chk(careFreq.includes('偶而') || careFreq.includes('偶爾'));
  m.Q4_2_1_其他 = chk(!!careFreq && !careFreq.includes('每週') && !careFreq.includes('每月') && !careFreq.includes('偶'));
  m.Q4_2_1_週次 = extractNum(careFreq, /每週\s*(\d+)/);
  m.Q4_2_1_月次 = extractNum(careFreq, /每月\s*(\d+)/);
  m.Q4_2_1_偶而頻率 = '';
  m.Q4_2_1_其他說明 = m.Q4_2_1_其他 === CHK ? careFreq : '';

  // ---------- Q4-2-6 醫療合作 ----------
  const medCoop = get('4-2-6.  是否與醫療院所或健康照護單位建立合作或轉介管道？');
  m.Q4_2_6_YES = chk(medCoop.startsWith('是'));
  m.Q4_2_6_NO = chk(medCoop.startsWith('否'));
  m.Q4_2_6_DETAIL = get('4-2-7. 承上題，如勾「是」，請說明合作單位及方式；如勾 「否」， 請說明原因 (4-2-6)');
  m.Q4_2_6_REASON = '';

  // ---------- Q4-4-3 服務延伸 ----------
  const extend = get('4-4-3.  除高齡者外，社區是否將服務延伸至弱勢家庭、兒少或其他對象？');
  m.Q4_4_3_YES = chk(extend.startsWith('是'));
  m.Q4_4_3_NO = chk(extend.startsWith('否'));
  m.Q4_4_3_CONTENT = get('4-4-4. 承上題， 如勾「是」，請說明服務內容；如勾 「否」， 請說明原因   (4-4-3)');

  // ---------- Q5-1-1 補助設備 ----------
  const subEquip = get('5-1-1. 本計畫綠飲食或綠療育是否有補助設備？');
  m.Q5_1_1_YES = chk(subEquip.includes('有') && !subEquip.includes('無'));
  m.Q5_1_1_NO = chk(subEquip.includes('無'));
  m.Q5_1_1_DETAIL = get('5-1-2. 請詳列本計畫綠飲食或綠療育之補助設備。');

  // ---------- Q5-1-3 財產標示 ----------
  const property = get('5-1-3.  補助設備是否實際用於計畫執行，並已完成財產標示、列入財產清冊，存放於合法公共場域及妥善保管？');
  m.Q5_1_3_廚房 = chk(property.includes('共餐廚房'));
  m.Q5_1_3_場域 = chk(property.includes('上課場域'));
  m.Q5_1_3_其他 = chk(property.includes('其他'));
  m.Q5_1_3_NO = chk(property.startsWith('否'));
  m.Q5_1_3_其他說明 = get('5-1-4  承上題，請說明原因 (5-1-3)');

  return m;
}

// ========== Utilities ==========
function extractNum(str, re) {
  if (!str) return '';
  const m = str.match(re);
  return m ? m[1] : '';
}
function extractNumFirst(str) {
  if (!str) return '';
  const m = str.match(/(\d+)/);
  return m ? m[1] : '';
}
function splitHelps(str) {
  if (!str) return [];
  // 支援 "1. xxx 2. yyy 3. zzz" 或 "1.xxx 2.yyy" 或換行分隔
  const items = [];
  // 先試著用 "1.", "2.", "3." 分割
  const regex = /(?:^|\s|、|\n)(?:[123]|[一二三])[\.、\s]+([^\n]+?)(?=(?:\s+(?:[123]|[一二三])[\.、\s])|$)/g;
  let match;
  while ((match = regex.exec(str)) !== null) {
    items.push(match[1].trim());
  }
  if (items.length >= 1) return items;
  // 換行分隔
  const lines = str.split(/\n+/).map(s => s.trim()).filter(Boolean);
  if (lines.length > 1) return lines;
  // 空白分隔多項
  const spaceParts = str.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
  if (spaceParts.length > 1) return spaceParts;
  return [str];
}

// ========== 套用對應表到 XML ==========
function applyMapping(xml, mapping) {
  const xmlEscape = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let out = xml;
  for (const [key, val] of Object.entries(mapping)) {
    const placeholder = '{' + '{' + key + '}' + '}';
    out = out.split(placeholder).join(xmlEscape(val));
  }
  // 清掉沒對到的 placeholder（保留 □）
  out = out.replace(new RegExp('\\{\\{[^}]+\\}\\}', 'g'), '');
  return out;
}
